spring.application.name=schema-demo


sever.port=8087

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081
spring.kafka.producer.properties.auto.register.schemas=true

kafka.topic.user-events=user-events



spring.kafka.consumer.group-id=javatechie-new
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.schema.registry.url=http://127.0.0.1:8081

## set to ensure the Consumer automatically maps incoming messages to the generated `Employee` class.
spring.kafka.consumer.properties.specific.avro.reader=true
